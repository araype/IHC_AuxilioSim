<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#dc2626" />
  <meta name="description" content="AuxilioSim — Simulador interactivo de primeros auxilios en el hogar" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <title>AuxilioSim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="shell">
    <!-- Escritorio: navegación lateral -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"></span>
        <div><span class="brand-name">AuxilioSim</span><span class="brand-sub">Primeros auxilios</span></div>
      </div>
      <nav class="side-nav" id="side-nav" aria-label="Principal"></nav>
      <div class="side-foot">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Contenido conforme a directrices ERC, AHA y Cruz Roja Internacional.</span>
      </div>
    </aside>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <div>
          <div class="top-row">
            <span class="brand-name t-mob">AuxilioSim</span>
            <h1 class="page-title t-desk" id="page-title">Escenarios</h1>
            <span class="online">ONLINE</span>
          </div>
          <span class="brand-sub t-mob" id="section-label">Escenarios</span>
          <span class="brand-sub t-desk" id="page-sub"></span>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="voice-btn" aria-label="Instrucciones por voz" aria-pressed="false"></button>
        <span class="avatar" id="avatar" aria-label="Perfil"></span>
      </div>
    </header>

    <main class="main" id="main"></main>

    <!-- Móvil: tab bar inferior -->
    <nav class="tabbar" id="tabbar" aria-label="Principal"></nav>
  </div>

  <!-- Simulador narrativo a pantalla completa -->
  <div class="sim" id="sim" hidden role="dialog" aria-modal="true" aria-label="Simulador"></div>

  <div class="modal" id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"><div id="modal-body"></div></div></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="js/scenes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
